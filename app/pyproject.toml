[project]
name = "podpalto-app"
version = "0.1.0"
description = "CrewAI agents, crews and flows for podpalto.cz competitive intelligence"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[anthropic,tools]>=1.15,<2",
    "podpalto-tools",
]

[project.scripts]
kickoff = "podpalto_app.main:kickoff"
plot = "podpalto_app.main:plot"

[tool.uv.sources]
podpalto-tools = { workspace = true }

[tool.crewai]
type = "flow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podpalto_app"]
