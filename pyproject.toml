# Root of the uv workspace. Members are installed into one shared .venv.
[project]
name = "podpalto-cz"
version = "0.1.0"
description = "Competitive Intelligence multi-agent system for podpalto.cz"
requires-python = ">=3.10,<3.14"
dependencies = [
    "podpalto-app",
    "podpalto-tools",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["app", "tools"]

[tool.uv.sources]
podpalto-app = { workspace = true }
podpalto-tools = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["app/tests", "tools/tests"]
