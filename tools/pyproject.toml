[project]
name = "podpalto-tools"
version = "0.1.0"
description = "Tools service (FastAPI): data sources used by the podpalto.cz agents"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.11",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podpalto_tools"]
