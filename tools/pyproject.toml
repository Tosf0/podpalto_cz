[project]
name = "podpalto-tools"
version = "0.1.0"
description = "Custom CrewAI tools shared by the podpalto.cz agents"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai>=1.15,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podpalto_tools"]
