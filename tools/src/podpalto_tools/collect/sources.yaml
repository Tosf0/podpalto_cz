# Source registry: every site the collector may visit. Nothing outside this file is fetched.
#
# kind      heureka_feed = Heureka-format XML product feed (two requests per run)
#           shoptet_html = sitemap + public product pages of a Shoptet shop, read from their
#                          schema.org microdata (one request per page, paused, page limit)
#           static_html  = price-list pages (page_paths). The app's CollectionFlow sends
#                          their text to the extraction crew; the tools service verifies
#                          the quoted rows against the page and does all arithmetic.
# pillar    1 e-shops | 2 coal yards | 3 DIY stores | 4 forests, firewood | 5 statistics
#           (the five source groups of the PDF report, section 2)
# region    region (kraj) of the seller; price_region = where its prices apply (CZ =
#           nationwide). Both feed the region filter of the report tools.
# price_includes_vat  default when a price list does not say (forestry often excludes VAT)
# delivery_included   true when the price includes delivery; omit when not known
# enabled   false = never fetched, and its stored records are no longer served
# consent   none | requested | granted: has the seller agreed to its prices being shown?
#           Nothing enforces it yet; it records where each seller stands.
# url_filter (shoptet_html) regex a sitemap URL path must match; use it for shops whose
#           range is mostly something other than fuel.
#
# Checked on 2026-11-16/17: the first five shops serve the feed; the other five answer
# 403 on the feed, so they are read from the pages their robots.txt allows and their
# sitemap lists. The feed block itself is not worked around.
# Checked on 2026-11-17: the twelve price lists of pillars 2 and 4 (taken from the PDF
# report) are allowed by robots.txt and served as plain HTML with prices in the page.

